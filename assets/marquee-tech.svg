<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="CodeX404 Continuous Tech Scroller">
  <defs>
    <linearGradient id="scrollerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="25%" stop-color="#091224"/>
      <stop offset="75%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Clip Path Strictly Isolated to Scrolling Channel (X: 170 to 1185) -->
    <clipPath id="marqueeViewportClip">
      <rect x="0" y="0" width="1015" height="64" rx="0"/>
    </clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes continuousScroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1600px); }
      }

      .scroll-track {
        animation: continuousScroll 24s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Base with Rounded Border -->
  <rect width="1200" height="64" rx="10" fill="url(#scrollerBg)"/>
  <rect x="1" y="1" width="1198" height="62" rx="10" fill="none" stroke="url(#neonBorder)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Left Header Badge (Protected Zone X: 0 to 160) -->
  <g transform="translate(14, 15)">
    <rect x="0" y="0" width="130" height="34" rx="6" fill="#0b172a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6"/>
    <text class="sans" x="14" y="22" fill="#00f2fe" font-size="11.5" font-weight="800" letter-spacing="1">TECH ARSENAL</text>
  </g>

  <!-- Divider Line -->
  <line x1="158" y1="12" x2="158" y2="52" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Scrolling Viewport Strictly Clipped Inside Bounds (X: 170 to 1185) -->
  <g transform="translate(170, 0)">
    <g clip-path="url(#marqueeViewportClip)">
      <g class="scroll-track mono" font-size="12.5" font-weight="600">
        <!-- Sequence 1 -->
        <g transform="translate(0, 37)">
          <text x="0" fill="#38bdf8">🤖 Azure OpenAI</text>
          <text x="140" fill="#475569">•</text>
          <text x="160" fill="#34d399">⚡ Python 3.12 &amp; FastAPI</text>
          <text x="360" fill="#475569">•</text>
          <text x="380" fill="#c084fc">🧠 Autonomous Agentic RAG</text>
          <text x="610" fill="#475569">•</text>
          <text x="630" fill="#00f2fe">🛡️ Zero-Defect Architecture</text>
          <text x="860" fill="#475569">•</text>
          <text x="880" fill="#fbbf24">🌐 React.js &amp; Next.js 14</text>
          <text x="1070" fill="#475569">•</text>
          <text x="1090" fill="#f472b6">🐳 Dockerized Microservices</text>
          <text x="1330" fill="#475569">•</text>
          <text x="1350" fill="#38bdf8">🔍 Qdrant &amp; Pinecone Vector DB</text>
          <text x="1590" fill="#475569">•</text>
        </g>

        <!-- Sequence 2 (Identical duplicate starting at 1600px) -->
        <g transform="translate(1600, 37)">
          <text x="0" fill="#38bdf8">🤖 Azure OpenAI</text>
          <text x="140" fill="#475569">•</text>
          <text x="160" fill="#34d399">⚡ Python 3.12 &amp; FastAPI</text>
          <text x="360" fill="#475569">•</text>
          <text x="380" fill="#c084fc">🧠 Autonomous Agentic RAG</text>
          <text x="610" fill="#475569">•</text>
          <text x="630" fill="#00f2fe">🛡️ Zero-Defect Architecture</text>
          <text x="860" fill="#475569">•</text>
          <text x="880" fill="#fbbf24">🌐 React.js &amp; Next.js 14</text>
          <text x="1070" fill="#475569">•</text>
          <text x="1090" fill="#f472b6">🐳 Dockerized Microservices</text>
          <text x="1330" fill="#475569">•</text>
          <text x="1350" fill="#38bdf8">🔍 Qdrant &amp; Pinecone Vector DB</text>
          <text x="1590" fill="#475569">•</text>
        </g>
      </g>
    </g>

    <!-- Side Gradient Masks -->
    <rect x="0" y="2" width="30" height="60" fill="url(#scrollerBg)" opacity="0.95"/>
    <rect x="985" y="2" width="30" height="60" fill="url(#scrollerBg)" opacity="0.95"/>
  </g>
</svg>
