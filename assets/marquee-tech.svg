<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 74" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="CodeX404 Continuous Tech Scroller">
  <defs>
    <linearGradient id="scrollerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="25%" stop-color="#091224"/>
      <stop offset="75%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <clipPath id="marqueeViewportClip">
      <rect x="0" y="0" width="1005" height="74" rx="0"/>
    </clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes continuousScroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1600px); }
      }

      .scroll-track {
        animation: continuousScroll 24s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="74" rx="12" fill="url(#scrollerBg)"/>
  <rect x="1" y="1" width="1198" height="72" rx="12" fill="none" stroke="url(#neonBorder)" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Left Header Badge (X: 14 to 164) -->
  <g transform="translate(14, 16)">
    <rect x="0" y="0" width="144" height="42" rx="8" fill="#0b172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
    <text class="sans" x="14" y="26" fill="#00f2fe" font-size="12.5" font-weight="900" letter-spacing="1.2">TECH ARSENAL</text>
  </g>

  <!-- Divider -->
  <line x1="172" y1="12" x2="172" y2="62" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Scrolling Viewport (X: 180 to 1185) -->
  <g transform="translate(180, 0)">
    <g clip-path="url(#marqueeViewportClip)">
      <g class="scroll-track mono" font-size="13.5" font-weight="700">
        <!-- Sequence 1 -->
        <g transform="translate(0, 43)">
          <text x="0" fill="#38bdf8">🤖 Azure OpenAI</text>
          <text x="155" fill="#475569">•</text>
          <text x="175" fill="#34d399">⚡ Python 3.12 &amp; FastAPI</text>
          <text x="390" fill="#475569">•</text>
          <text x="410" fill="#c084fc">🧠 Autonomous Agentic RAG</text>
          <text x="655" fill="#475569">•</text>
          <text x="675" fill="#00f2fe">🛡️ Zero-Defect Architecture</text>
          <text x="920" fill="#475569">•</text>
          <text x="940" fill="#fbbf24">🌐 React.js &amp; Next.js 14</text>
          <text x="1145" fill="#475569">•</text>
          <text x="1165" fill="#f472b6">🐳 Docker Containers</text>
          <text x="1360" fill="#475569">•</text>
          <text x="1380" fill="#38bdf8">🔍 Qdrant &amp; Pinecone Vector DB</text>
          <text x="1635" fill="#475569">•</text>
        </g>

        <!-- Sequence 2 -->
        <g transform="translate(1600, 43)">
          <text x="0" fill="#38bdf8">🤖 Azure OpenAI</text>
          <text x="155" fill="#475569">•</text>
          <text x="175" fill="#34d399">⚡ Python 3.12 &amp; FastAPI</text>
          <text x="390" fill="#475569">•</text>
          <text x="410" fill="#c084fc">🧠 Autonomous Agentic RAG</text>
          <text x="655" fill="#475569">•</text>
          <text x="675" fill="#00f2fe">🛡️ Zero-Defect Architecture</text>
          <text x="920" fill="#475569">•</text>
          <text x="940" fill="#fbbf24">🌐 React.js &amp; Next.js 14</text>
          <text x="1145" fill="#475569">•</text>
          <text x="1165" fill="#f472b6">🐳 Docker Containers</text>
          <text x="1360" fill="#475569">•</text>
          <text x="1380" fill="#38bdf8">🔍 Qdrant &amp; Pinecone Vector DB</text>
          <text x="1635" fill="#475569">•</text>
        </g>
      </g>
    </g>

    <rect x="0" y="2" width="25" height="70" fill="url(#scrollerBg)" opacity="0.95"/>
    <rect x="980" y="2" width="25" height="70" fill="url(#scrollerBg)" opacity="0.95"/>
  </g>
</svg>
