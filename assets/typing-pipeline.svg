<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="135" viewBox="0 0 1200 135" role="img" aria-label="CodeX404 Solutions Dynamic Terminal Stream">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="60%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>

    <linearGradient id="termHeaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="shimmerLine" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#00f2fe"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0,0" to="-1200,0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Clip Path for Dynamic Line Region (strictly prevents bleed into footer status) -->
    <clipPath id="streamStepClip">
      <rect x="0" y="0" width="1150" height="24" rx="0"/>
    </clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink { animation: blink 0.9s infinite; }

      /* Mutually Exclusive Step Transitions — 0% Overlap Guaranteed */
      @keyframes fadeStep1 {
        0%, 23% { opacity: 1; visibility: visible; }
        25%, 98% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes fadeStep2 {
        0%, 24% { opacity: 0; visibility: hidden; }
        26%, 48% { opacity: 1; visibility: visible; }
        50%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes fadeStep3 {
        0%, 49% { opacity: 0; visibility: hidden; }
        51%, 73% { opacity: 1; visibility: visible; }
        75%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes fadeStep4 {
        0%, 74% { opacity: 0; visibility: hidden; }
        76%, 98% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      .step-1 { animation: fadeStep1 16s infinite; }
      .step-2 { animation: fadeStep2 16s infinite; }
      .step-3 { animation: fadeStep3 16s infinite; }
      .step-4 { animation: fadeStep4 16s infinite; }
    </style>
  </defs>

  <!-- Base Body -->
  <rect width="1200" height="135" rx="12" fill="url(#termBg)"/>
  <rect x="1" y="1" width="1198" height="133" rx="12" fill="none" stroke="url(#shimmerLine)" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Terminal Top Header -->
  <path d="M 0 12 Q 0 0 12 0 L 1188 0 Q 1200 0 1200 12 L 1200 32 L 0 32 Z" fill="url(#termHeaderBg)"/>
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#1f2937" stroke-width="1"/>

  <!-- Window Traffic Lights -->
  <circle cx="22" cy="16" r="5" fill="#ef4444"/>
  <circle cx="38" cy="16" r="5" fill="#f59e0b"/>
  <circle cx="54" cy="16" r="5" fill="#10b981"/>

  <text class="mono" x="600" y="21" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">
    codex404-engine • dynamic enterprise orchestration stream
  </text>

  <!-- Static Terminal Prompt Line -->
  <g class="mono" font-size="12" transform="translate(24, 58)">
    <text fill="#38bdf8">❯ architect@codex404:~$ </text>
    <text x="180" fill="#f8fafc">./deploy_system.sh --target=enterprise-cloud --verify=zero-defect</text>
  </g>

  <!-- Dynamic Animated Cycling Lines Strictly Clipped (Y: 74 to 98) -->
  <g transform="translate(24, 74)" clip-path="url(#streamStepClip)">
    <g class="mono" font-size="12.5" font-weight="600">
      <!-- Stage 1 -->
      <g class="step-1" transform="translate(0, 16)">
        <text fill="#34d399">✔ [1/4] AGENTIC RAG:</text>
        <text x="165" fill="#38bdf8">Embedding private vector store with Qdrant + Azure OpenAI...</text>
        <text x="735" fill="#a7f3d0">[100% ACCURACY]</text>
      </g>

      <!-- Stage 2 -->
      <g class="step-2" transform="translate(0, 16)">
        <text fill="#34d399">✔ [2/4] MICROSERVICES:</text>
        <text x="185" fill="#00f2fe">Compiling asynchronous FastAPI endpoints with uvloop...</text>
        <text x="695" fill="#34d399">[LATENCY: 18.2ms]</text>
      </g>

      <!-- Stage 3 -->
      <g class="step-3" transform="translate(0, 16)">
        <text fill="#34d399">✔ [3/4] CODE AUDIT:</text>
        <text x="160" fill="#c084fc">Defensive schema verification &amp; Pydantic runtime enforcement...</text>
        <text x="730" fill="#fbbf24">[0 BUGS DETECTED]</text>
      </g>

      <!-- Stage 4 -->
      <g class="step-4" transform="translate(0, 16)">
        <text fill="#34d399">✔ [4/4] SCALE BENCHMARK:</text>
        <text x="205" fill="#f472b6">Insan Degree College ERP serving 25,000+ monthly students...</text>
        <text x="740" fill="#34d399">[UPTIME: 99.99%]</text>
      </g>
    </g>
  </g>

  <!-- Live Footer Status Pulse (Y: 118) -->
  <g class="mono" font-size="11.5" transform="translate(24, 118)">
    <text fill="#64748b">STATUS: <tspan fill="#34d399" font-weight="700">● PRODUCTION ONLINE</tspan> &#160;|&#160; CLIENT IP: <tspan fill="#38bdf8" font-weight="700">100% UNRESTRICTED</tspan> &#160;|&#160; SLA: <tspan fill="#fbbf24" font-weight="700">99.99% GUARANTEED</tspan><tspan class="cursor-blink" fill="#00f2fe"> █</tspan></text>
  </g>
</svg>
