<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="CodeX404 Enterprise Performance Metrics - Responsive Ribbon">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060f1e"/>
      <stop offset="100%" stop-color="#0c1b33"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0924"/>
      <stop offset="100%" stop-color="#1a113a"/>
    </linearGradient>

    <!-- Vibrant Number Gradients -->
    <linearGradient id="numCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="numPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="numGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="numGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="numPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

      @keyframes cardGlow {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.85; }
      }
      .glow-1 { animation: cardGlow 3.2s ease-in-out infinite; }
      .glow-2 { animation: cardGlow 3.8s ease-in-out infinite 0.6s; }
      .glow-3 { animation: cardGlow 3.4s ease-in-out infinite 1.2s; }
      .glow-4 { animation: cardGlow 4.1s ease-in-out infinite 1.8s; }
      .glow-5 { animation: cardGlow 3.6s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <!-- Card 1: 99.99% Uptime SLA (X: 0 to 224) -->
  <g transform="translate(0, 4)">
    <rect width="224" height="132" rx="12" fill="url(#cardGrad1)"/>
    <rect class="glow-1" x="1" y="1" width="222" height="130" rx="12" fill="none" stroke="#00f2fe" stroke-width="1.3"/>
    <text class="sans" x="112" y="56" font-size="38" font-weight="900" fill="url(#numCyan)" text-anchor="middle">99.99%</text>
    <text class="sans" x="112" y="86" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">UPTIME SLA</text>
    <rect x="36" y="98" width="152" height="22" rx="11" fill="#032030" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
    <text class="mono" x="112" y="113" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">High Availability</text>
  </g>

  <!-- Card 2: < 50ms API Response (X: 244 to 468) -->
  <g transform="translate(244, 4)">
    <rect width="224" height="132" rx="12" fill="url(#cardGrad2)"/>
    <rect class="glow-2" x="1" y="1" width="222" height="130" rx="12" fill="none" stroke="#c084fc" stroke-width="1.3"/>
    <text class="sans" x="112" y="56" font-size="38" font-weight="900" fill="url(#numPurple)" text-anchor="middle">&lt; 50ms</text>
    <text class="sans" x="112" y="86" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">API RESPONSE</text>
    <rect x="36" y="98" width="152" height="22" rx="11" fill="#1e0e38" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.5"/>
    <text class="mono" x="112" y="113" font-size="10.5" font-weight="600" fill="#c084fc" text-anchor="middle">FastAPI + uvloop</text>
  </g>

  <!-- Card 3: 25K+ Monthly Students (X: 488 to 712) -->
  <g transform="translate(488, 4)">
    <rect width="224" height="132" rx="12" fill="url(#cardGrad1)"/>
    <rect class="glow-3" x="1" y="1" width="222" height="130" rx="12" fill="none" stroke="#34d399" stroke-width="1.3"/>
    <text class="sans" x="112" y="56" font-size="38" font-weight="900" fill="url(#numGreen)" text-anchor="middle">25K+</text>
    <text class="sans" x="112" y="86" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">MONTHLY VISITS</text>
    <rect x="36" y="98" width="152" height="22" rx="11" fill="#042618" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.5"/>
    <text class="mono" x="112" y="113" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle">Insan Degree ERP</text>
  </g>

  <!-- Card 4: 100% Senior Direct Eng (X: 732 to 956) -->
  <g transform="translate(732, 4)">
    <rect width="224" height="132" rx="12" fill="url(#cardGrad2)"/>
    <rect class="glow-4" x="1" y="1" width="222" height="130" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
    <text class="sans" x="112" y="56" font-size="38" font-weight="900" fill="url(#numGold)" text-anchor="middle">100%</text>
    <text class="sans" x="112" y="86" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">SENIOR DIRECT</text>
    <rect x="36" y="98" width="152" height="22" rx="11" fill="#2d1c04" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.5"/>
    <text class="mono" x="112" y="113" font-size="10.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Zero Junior Handoffs</text>
  </g>

  <!-- Card 5: 0% Vendor Lock-in (X: 976 to 1200) -->
  <g transform="translate(976, 4)">
    <rect width="224" height="132" rx="12" fill="url(#cardGrad1)"/>
    <rect class="glow-5" x="1" y="1" width="222" height="130" rx="12" fill="none" stroke="#f472b6" stroke-width="1.3"/>
    <text class="sans" x="112" y="56" font-size="38" font-weight="900" fill="url(#numPink)" text-anchor="middle">0%</text>
    <text class="sans" x="112" y="86" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">VENDOR LOCK-IN</text>
    <rect x="36" y="98" width="152" height="22" rx="11" fill="#2e0a1a" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.5"/>
    <text class="mono" x="112" y="113" font-size="10.5" font-weight="600" fill="#f472b6" text-anchor="middle">100% Client IP Owned</text>
  </g>
</svg>
